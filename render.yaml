# Render 블루프린트 — 대시보드에서 손으로 만들지 않고 이 파일로 만든다.
#
# 주의 하나: rootDir 이 server 지만 코드는 ../shared/engine.js 를 부른다.
# Render 는 저장소를 통째로 받아오므로 그 경로가 살아 있다. 규칙을 두 벌로
# 만들지 않기 위한 의도적인 배치다.
services:
  - type: web
    name: mini-shogi
    runtime: node
    plan: free
    region: singapore          # Neon 이 ap-southeast-1 이다. 붙여 둔다
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL      # Neon 풀링 주소. 대시보드에서 직접 넣는다
        sync: false            # 저장소에 값을 적지 않는다
